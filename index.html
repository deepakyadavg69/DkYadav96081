<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Download</title><style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f1115;color:#e8ecf1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
 display:flex;align-items:center;justify-content:center;padding:22px}
a.btn{display:block;width:100%;max-width:420px;background:#12351f;border:2px solid #2f6b4f;color:#6ee7a0;
 text-decoration:none;border-radius:18px;padding:26px 18px;font-size:20px;font-weight:800;text-align:center;
 letter-spacing:.3px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:.15s}
a.btn:hover{background:#17472a;border-color:#3f8f68}
a.btn:active{transform:scale(.98)}
a.btn svg{display:block;margin:0 auto 12px}
</style></head><body>
<a class="btn" id="dl" href="DeviceInformation-v4.1.apk" download>
<svg viewBox="0 0 24 24" width="64" height="64" aria-hidden="true">
<path fill="none" stroke="#6ee7a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
 d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg>
APK DOWNLOAD
</a>
<script>
/* 🔄 apne aap sabse NAYA apk file pakadta hai — aapko page me kuchh badalna nahi padta.
   Sirf nayi APK file upload kar dena; button khud usi par chala jayega. */
(function () {
  var owner = "deepakyadavg69", repo = "DkYadav96081";
  var btn = document.getElementById("dl");
  var base = location.origin + location.pathname.replace(/[^\/]*$/, "");
  if (/\.github\.io$/.test(location.hostname) || location.hostname.indexOf(".github.io") > -1) {
    base = "https://" + owner + ".github.io/" + repo + "/";
  }
  function ver(n) {
    var m = n.toLowerCase().match(/v?(\d+)[._-](\d+)/);
    return m ? (+m[1]) * 1000 + (+m[2]) : 0;
  }
  fetch("https://api.github.com/repos/" + owner + "/" + repo + "/contents/?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (list) {
      if (!Array.isArray(list)) return;
      var apk = list.filter(function (f) { return /\.apk$/i.test(f.name || ""); });
      if (!apk.length) return;
      apk.sort(function (a, b) { return ver(b.name) - ver(a.name) || (b.size || 0) - (a.size || 0); });
      var f = apk[0];
      btn.href = base + encodeURIComponent(f.name);
      btn.setAttribute("download", f.name);
    })
    .catch(function () { /* net na ho to purana link hi chalega */ });
})();
</script>
</body></html>
