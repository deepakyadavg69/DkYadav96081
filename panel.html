<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guardian Panel</title>
<style>
:root{
  --bg:#06070b; --panel:#0b0f16; --line:#1b2230; --line2:#232c3d;
  --txt:#e8edf7; --muted:#7b879b; --dim:#4d5868;
  --violet:#9b7cff; --cyan:#38e1ff; --green:#5ce6a0; --amber:#ffc44d; --red:#ff6b7a;
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
  font-size:calc(15px*var(--fs));overflow-x:hidden}
body{padding-bottom:74px}
a{color:var(--cyan);text-decoration:none}
button{font-family:inherit}

/* ---------- top bar ---------- */
.tb{display:flex;align-items:center;gap:10px;padding:10px 13px;background:#080a10;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.tb b{font-size:.98rem;letter-spacing:.2px}
.tb .sub{color:var(--muted);font-size:.72rem;margin-left:2px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block;
  box-shadow:0 0 8px currentColor;animation:p 2s infinite}
.dot.on{background:var(--green)}
@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
.tb .sp{flex:1}

/* ---------- screens ---------- */
.screen{display:none;padding:13px 13px 22px;animation:fade .25s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.section{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px}
.section h2{margin:0;font-size:.9rem;letter-spacing:.3px;color:#cfd8e8;font-weight:700}
.section .link{color:var(--violet);font-size:.78rem;cursor:pointer}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:linear-gradient(180deg,#0c1019,#0a0d15);border:1px solid var(--line);
  border-radius:15px;padding:14px}
.stat .k{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.7px}
.stat .v{font-size:1.5rem;font-weight:800;margin-top:5px}
.stat .s{color:var(--dim);font-size:.74rem;margin-top:3px}
.v.green{color:var(--green)} .v.amber{color:var(--amber)} .v.red{color:var(--red)}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.chip{background:#0d1220;border:1px solid var(--line);color:var(--txt);border-radius:22px;
  padding:8px 13px;font-size:.82rem;font-weight:600;cursor:pointer;
  transition:transform .16s,border-color .16s,background .16s}
.chip:active{transform:scale(.96)}
.chip.on{border-color:var(--violet);background:#171233;color:#fff;box-shadow:0 0 16px #9b7cff30}

/* ---------- device card ---------- */
.device{position:relative;overflow:hidden}
.device .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.device h3{margin:0;font-size:1.05rem}
.device .meta{color:var(--muted);font-size:.76rem;margin:4px 0 0}
.device .meta .mono{font-family:ui-monospace,Menlo,Consolas,monospace;color:#93a0b5}
.badge{border-radius:20px;padding:4px 10px;font-size:.72rem;font-weight:700;white-space:nowrap}
.badge.ok{background:#0c2a20;color:var(--green);border:1px solid #1c5340}
.badge.warn{background:#2c2410;color:var(--amber);border:1px solid #5a4a1c}
.badge.bad{background:#2c1116;color:var(--red);border:1px solid #5c2029}
.bar{height:7px;border-radius:6px;background:#131a26;margin:12px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width 1s cubic-bezier(.2,.9,.2,1)}
.bar i.low{background:linear-gradient(90deg,#ff6b7a,#ffc44d)}
.device .ft{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;gap:8px;flex-wrap:wrap}
.qrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-top:12px}
.qrow button{background:#0e1420;border:1px solid var(--line2);color:var(--txt);border-radius:11px;
  padding:11px 8px;font-size:.8rem;font-weight:600;cursor:pointer;transition:.16s}
.qrow button:active{transform:scale(.97);border-color:var(--violet)}
.offnote{background:#170b0e;border:1px solid #4a1d26;color:#ffb3bd;border-radius:12px;
  padding:10px 12px;font-size:.8rem;margin-top:12px;line-height:1.4}

/* ---------- map ---------- */
.map{position:relative;height:268px;border-radius:15px;overflow:hidden;border:1px solid var(--line);
  background:#080b12 url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='40' height='40'%3E%3Cpath d='M0 0h40v40H0z' fill='%230a0e15'/%3E%3Cpath d='M0 39.5h40M39.5 0v40' stroke='%23141c28' stroke-width='1'/%3E%3C/svg%3E")}
.map .tiles{position:absolute;inset:0}
.map .tiles img{position:absolute;width:256px;height:256px;pointer-events:none;opacity:.92}
.map .pin{position:absolute;transform:translate(-50%,-100%);font-size:.7rem;font-weight:800;color:#fff;
  background:linear-gradient(180deg,#9b7cff,#6d4bb4);border-radius:9px;padding:4px 8px;white-space:nowrap;
  box-shadow:0 6px 16px #000a;cursor:pointer;border:1px solid #b9a6ff55}
.map .pin:after{content:"";position:absolute;left:50%;top:100%;width:2px;height:8px;background:#9b7cff;transform:translateX(-50%)}
.map .pin.me{background:linear-gradient(180deg,#38e1ff,#1a7fa8)}
.map .ctl{position:absolute;right:9px;bottom:9px;display:flex;flex-direction:column;gap:6px}
.map .ctl button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:#0d1220cc;
  color:#dbe3f0;font-size:1rem;cursor:pointer;backdrop-filter:blur(4px)}
.map .attr{position:absolute;left:6px;bottom:5px;font-size:.6rem;color:#9aa6b8;background:#0008;padding:2px 5px;border-radius:5px}
.map .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:.82rem;text-align:center;padding:20px}

/* ---------- apps + feed ---------- */
.approw{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid #131a26}
.approw:last-child{border-bottom:0}
.approw .ic{width:34px;height:34px;border-radius:9px;background:#141b29;display:flex;align-items:center;
  justify-content:center;font-size:.95rem;flex:0 0 34px}
.approw .nm{flex:1;min-width:0}
.approw .nm b{font-size:.86rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.approw .nm small{color:var(--muted);font-size:.72rem}
.approw .tm{color:var(--dim);font-size:.72rem;white-space:nowrap}
.feed .item{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid #131a26;animation:fade .3s}
.feed .item:last-child{border-bottom:0}
.feed .item .ic{font-size:1rem;flex:0 0 22px;text-align:center}
.feed .item .tx{flex:1;min-width:0}
.feed .item .tx b{font-size:.85rem;font-weight:600;display:block;line-height:1.35;word-break:break-word}
.feed .item .tx small{color:var(--muted);font-size:.72rem}
.feed .empty{color:var(--dim);font-size:.82rem;padding:12px 2px}

/* ---------- command bubble rows ---------- */
.lines{display:flex;flex-direction:column;gap:9px}
.crow{display:block;width:100%;text-align:left;background:linear-gradient(180deg,#0d121c,#0a0e16);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--txt);cursor:pointer;
  position:relative;overflow:hidden;transition:border-color .18s,transform .14s,box-shadow .2s}
.crow:active{transform:scale(.985)}
.crow:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--violet);opacity:.65}
.crow .c1{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.9rem}
.crow .c1 .em{font-size:1.1rem}
.crow .c1 .code{font-family:ui-monospace,Menlo,Consolas,monospace;color:#a9e9ff;
  background:#0a1622;border:1px solid #1d3548;border-radius:7px;padding:2px 7px;font-size:.78rem}
.crow .c2{color:var(--muted);font-size:.79rem;margin-top:6px;line-height:1.4}
.crow .c3{color:#8d7bb8;font-size:.74rem;margin-top:4px;font-weight:600}
.crow:after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;
  background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .9s}
.crow.sending:after{width:100%}
.crow.done{border-color:#2c6b4f;box-shadow:0 0 0 1px #2c6b4f55}
.cathead{margin:18px 2px 8px;padding-bottom:6px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center}
.cathead span{font-weight:800;font-size:.9rem}
.cathead small{color:var(--muted);font-size:.74rem}

/* ---------- table ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.82rem;min-width:560px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #131a26;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.5px}
tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.mini{background:#101726;border:1px solid var(--line2);color:var(--txt);border-radius:9px;
  padding:7px 11px;font-size:.78rem;font-weight:600;cursor:pointer}
.mini.acc{border-color:var(--violet);background:#181233}

/* ---------- inputs ---------- */
input.txt{width:100%;background:#0a0f18;border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:11px 13px;font-size:.88rem;outline:none}
input.txt:focus{border-color:var(--violet)}
.row{display:flex;gap:9px;align-items:center}
.row.wrap{flex-wrap:wrap}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#07090ff2;backdrop-filter:blur(12px);
  border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 4px 8px;font-size:.66rem;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
.nav button i{font-size:1.05rem;font-style:normal}
.nav button.active{color:#fff}
.nav button.active i{filter:drop-shadow(0 0 8px #9b7cff88)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:#151b2b;
  border:1px solid var(--line2);color:#eef3ff;padding:11px 16px;border-radius:12px;font-size:.84rem;
  opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw;text-align:center;
  box-shadow:0 14px 34px #000b}
.toast.show{opacity:1;transform:translate(-50%,0)}
.footer{color:var(--dim);font-size:.7rem;text-align:center;padding:16px 6px 26px}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,#111827,#1b2434,#111827);
  background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.center{max-width:520px;margin:10vh auto;text-align:center}
@media(min-width:940px){body{padding-bottom:0}
  .nav{position:sticky;bottom:auto;top:0;order:-1;border-top:0;border-bottom:1px solid var(--line)}
  .screen{padding:16px 20px 30px}}
</style>
</head>
<body>

<div class="tb">
  <span class="dot" id="live"></span>
  <b>Guardian Panel</b><span class="sub" id="tbSub"></span>
  <span class="sp"></span>
  <button class="mini" onclick="gRefresh()">Refresh</button>
</div>

<!-- ============ DASHBOARD ============ -->
<section class="screen on" id="v-dash">
  <div class="grid">
    <div class="card stat"><div class="k">Devices</div><div class="v" id="s1">—</div><div class="s" id="s1s"></div></div>
    <div class="card stat"><div class="k">Battery</div><div class="v" id="s2">—</div><div class="s" id="s2s"></div></div>
    <div class="card stat"><div class="k">Notifications</div><div class="v" id="s3">—</div><div class="s" id="s3s"></div></div>
    <div class="card stat"><div class="k">App version</div><div class="v" id="s4">—</div><div class="s" id="s4s"></div></div>
  </div>

  <div class="section"><h2>Devices</h2><span class="link" onclick="go('dev')">All devices ›</span></div>
  <div class="chips" id="devChips"></div>
  <section class="grid" style="grid-template-columns:1fr" id="devCards"></section>

  <div class="section"><h2>Map</h2><span class="link" id="mapInfo"></span></div>
  <div class="map" id="map">
    <div class="tiles" id="mapTiles"></div>
    <div class="none" id="mapNone">—</div>
    <div class="ctl">
      <button onclick="mapZoom(1)">＋</button>
      <button onclick="mapZoom(-1)">－</button>
      <button onclick="mapFit()">◎</button>
    </div>
    <div class="attr">© OpenStreetMap</div>
  </div>

  <div class="section"><h2>Recent apps</h2><span class="link" id="appsAt"></span></div>
  <div class="card" id="apps"></div>

  <div class="section"><h2>Live activity</h2><span class="link" onclick="go('act')">All ›</span></div>
  <div class="card feed" id="feed"></div>

  <div class="section"><h2>Notifications</h2><span class="link" onclick="go('act')">All ›</span></div>
  <div class="card feed" id="nfeed"></div>
</section>

<!-- ============ DEVICES ============ -->
<section class="screen" id="v-dev">
  <div class="section"><h2>Paired devices</h2><span class="link" id="devCount"></span></div>
  <div class="tblwrap"><table id="devTable"></table></div>
  <div class="section"><h2>Selected device</h2><span class="link" id="targetName"></span></div>
  <div class="offnote" id="offlineNote" style="display:none"></div>
  <div class="lines" id="devGrid"></div>
</section>

<!-- ============ COMMANDS ============ -->
<section class="screen" id="v-cmd">
  <div class="section"><h2>Commands</h2><span class="link" id="cmdCount"></span></div>
  <input class="txt" id="q" placeholder="Search" oninput="renderCmds()">
  <div class="chips" id="catChips" style="margin-top:10px"></div>
  <div class="lines" id="cmdGrid"></div>
</section>

<!-- ============ ACTIVITY ============ -->
<section class="screen" id="v-act">
  <div class="section"><h2>Live activity</h2><span class="link" id="evCount"></span></div>
  <div class="card feed" id="feedFull"></div>
  <div class="section"><h2>Notifications</h2><span class="link" id="ntCount"></span></div>
  <div class="card feed" id="nfeedFull"></div>
</section>

<!-- ============ SETTINGS ============ -->
<section class="screen" id="v-set">
  <div class="section"><h2>Settings</h2></div>
  <div class="card">
    <div class="row wrap" style="justify-content:space-between">
      <div><b style="font-size:.9rem">Refresh</b><div class="s" style="color:var(--muted);font-size:.75rem" id="setRefresh"></div></div>
      <div class="row">
        <button class="chip" onclick="setEvery(4000)">4s</button>
        <button class="chip" onclick="setEvery(10000)">10s</button>
        <button class="chip" onclick="setEvery(30000)">30s</button>
      </div>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
    <div class="row wrap" style="justify-content:space-between">
      <b style="font-size:.9rem">Text size</b>
      <div class="row">
        <button class="chip" onclick="zoom(-1)">A−</button>
        <button class="chip" onclick="zoom(1)">A+</button>
      </div>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
    <div class="row wrap" style="justify-content:space-between">
      <b style="font-size:.9rem">Theme</b>
      <div class="row" id="themes"></div>
    </div>
  </div>
  <div class="section"><h2>Connection</h2></div>
  <div class="card">
    <div class="mono" style="font-size:.78rem;color:var(--muted);word-break:break-all" id="setWorker"></div>
    <div style="margin-top:10px;font-size:.8rem;color:var(--muted)" id="setLink"></div>
  </div>
  <p class="footer" id="foot"></p>
</section>

<nav class="nav">
  <button data-v="dash" class="active" onclick="go('dash')"><i>◎</i>Dashboard</button>
  <button data-v="dev" onclick="go('dev')"><i>▤</i>Devices</button>
  <button data-v="cmd" onclick="go('cmd')"><i>⌘</i>Commands</button>
  <button data-v="act" onclick="go('act')"><i>≡</i>Activity</button>
  <button data-v="set" onclick="go('set')"><i>⚙</i>Settings</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ================================================================
   Guardian Panel — real data only. Har cheez pul se aati hai.
   ================================================================ */
var DEFAULT_WORKER = "https://guard-panel.panel-be888cda.workers.dev";
var G = window.__guard || {};
var WORKER = G.w || (location.hash.match(/w=([^&]+)/) || [])[1] || localStorage.getItem("gw") || DEFAULT_WORKER;
var TOKEN  = G.t || (location.hash.match(/t=([A-Fa-f0-9]{8,})/) || [])[1] || "";
try { if (WORKER) { WORKER = decodeURIComponent(WORKER).replace(/\/+$/,''); localStorage.setItem("gw", WORKER); } } catch(e) {}
try { if (G.t) history.replaceState(null, "", location.pathname); } catch(e) {}

var DEV = [];              // pul se aaye device (real)
var EV = [], NT = [], TH = [], APPS = [], APPS_AT = 0;
var LATEST = "";           // latest APK version (apne page se)
var target = 0;
var every = +(localStorage.getItem("gevery") || 4000);
var lastCid = "", tid = 0, firstSeen = {};

function $(s){ return document.querySelector(s); }
function El(t,c,h){ var d=document.createElement(t); if(c)d.className=c; if(h!=null)d.innerHTML=h; return d; }
function esc(x){ return String(x==null?"":x).replace(/[&<>"]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
function tm(at){ var m=Number(at||0); if(!m) return ""; try { return new Date(m).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); } catch(e){ return ""; } }
function ago(at){ var m=Number(at||0); if(!m) return ""; var s=Math.max(0,(Date.now()-m)/1000);
  if(s<60) return Math.round(s)+"s"; if(s<3600) return Math.round(s/60)+" min"; if(s<86400) return Math.round(s/3600)+" ghante"; return Math.round(s/86400)+" din"; }
function toast(t){ var x=$("#toast"); x.textContent=t; x.classList.add("show"); clearTimeout(x._t); x._t=setTimeout(function(){x.classList.remove("show");},2600); }
function go(v){ document.querySelectorAll(".screen").forEach(function(s){ s.classList.toggle("on", s.id==="v-"+v); });
  document.querySelectorAll(".nav button").forEach(function(b){ b.classList.toggle("active", b.dataset.v===v); });
  if(v==="dash") mapFit(); window.scrollTo({top:0,behavior:"smooth"}); }
function zoom(d){ var cur=parseFloat(document.documentElement.style.getPropertyValue("--fs"))||1;
  cur=Math.min(1.5,Math.max(.8,cur+d*0.08)); document.documentElement.style.setProperty("--fs",cur);
  localStorage.setItem("gfs",cur); }
function setEvery(ms){ every=ms; localStorage.setItem("gevery",ms); tick(); $("#setRefresh").textContent=ms/1000+" second"; }

/* ---------------- pul ---------------- */
function api(path, body, method){
  if(!WORKER) return Promise.resolve(null);
  return fetch(WORKER+path,{ method:method||"POST", headers:{"content-type":"application/json"},
    body: body?JSON.stringify(body):undefined }).then(function(r){ return r.json(); }).catch(function(){ return null; });
}
function verNum(v){ var m=String(v||"").match(/(\d+)\.(\d+)/); return m? (+m[1]*1000 + +m[2]) : 0; }

/* ---------------- data ---------------- */
function pull(){
  api("/s?t="+TOKEN+(lastCid?"&cid="+lastCid:""), null, "GET").then(function(j){
    var d=$("#live");
    if(!j || !j.ok){ d.classList.remove("on"); if(j && j.err) toast(j.err); return; }
    d.classList.add("on");
    DEV = j.devs || []; EV = j.events || []; NT = j.notis || []; TH = j.thumbs || [];
    if(target>=DEV.length) target=0;
    var prim = (j.primary||"");
    if(firstSeen.prim !== prim){ firstSeen.prim = prim; for(var i=0;i<DEV.length;i++) if(DEV[i].id===prim) target=i; }
    DEV.forEach(function(d){ var st=d.state||{}; if(!APPS.length || (st.apps && st.apps.length) || (st.appsAt||0)>APPS_AT){
      APPS = (st.apps && st.apps.length? st.apps : APPS); APPS_AT = st.appsAt || APPS_AT; APPS_DEV = d.name; } });
    render();
    if(j.result && j.result.text){ addResult(j.result.text); }
  });
}
function tick(){ clearInterval(tid); tid=setInterval(pull, every); }

/* ---------------- renders ---------------- */
function stats(){
  var on = DEV.filter(function(d){ return stOn(d); });
  var low = null; on.forEach(function(d){ var b=batt(d); if(!low || b<low.b) low={b:b,n:d.name}; });
  $("#s1").textContent = on.length+"/"+DEV.length;
  $("#s1s").textContent = DEV.length? (on.length+" online · "+(DEV.length-on.length)+" offline") : "—";
  $("#s2").textContent = low? low.b+"%" : "—"; $("#s2s").textContent = low? low.n : "—";
  $("#s3").textContent = NT.length; $("#s3s").textContent = NT.length? ("latest "+ago((NT[NT.length-1]||{}).at)+" pehle") : "—";
  var v = DEV.length? (DEV[0].state && DEV[0].state.ver) || DEV[0].ver || "?" : "—";
  var up = LATEST && verNum(v) < verNum(LATEST);

/* ---------------- map (real devices only) ---------------- */
var mz = 12, mc = null;
function proj(lat,lng,z){ var s=256*Math.pow(2,z);
  var x=(lng+180)/360*s, y=(1-Math.log(Math.tan(Math.PI/4+lat*Math.PI/360))/Math.PI)/2*s; return [x,y]; }
function mapFit(){
  var pts = DEV.filter(function(d){ return d.state && d.state.loc; });
  if(!pts.length){ mc=null; mapPins(); return; }
  var xs=[],ys=[];
  pts.forEach(function(d){ var p=proj(d.state.loc.lat,d.state.loc.lng,15); xs.push(p[0]); ys.push(p[1]); });
  var cx=(Math.min.apply(0,xs)+Math.max.apply(0,xs))/2, cy=(Math.min.apply(0,ys)+Math.max.apply(0,ys))/2;
  var w=$("#map").clientWidth||320, h=$("#map").clientHeight||260;
  var dx=Math.max.apply(0,xs)-Math.min.apply(0,xs), dy=Math.max.apply(0,ys)-Math.min.apply(0,ys);
  mz=15; while(mz>3 && (dx>w*0.7 || dy>h*0.6)){ mz--; dx/=2; dy/=2; }
  mc={x:cx/Math.pow(2,15-mz), y:cy/Math.pow(2,15-mz)};
  drawTiles(); mapPins();
}
function mapZoom(d){ mz=Math.max(3,Math.min(18,mz+d)); if(mc){ mc.x/=.5; mc.y/=.5; mc={x:mc.x/2,y:mc.y/2}; } drawTiles(); mapPins(); }
function drawTiles(){
  var box=$("#mapTiles"); if(!box) return;
  var m=$("#map"), w=m.clientWidth, h=m.clientHeight;
  if(!mc){ var pts=DEV.filter(function(d){return d.state&&d.state.loc;});
    if(pts.length){ var p=proj(pts[0].state.loc.lat,pts[0].state.loc.lng,mz); mc={x:p[0],y:p[1]}; } else { box.innerHTML=""; return; } }
  var n=Math.pow(2,mz), ox=mc.x-w/2, oy=mc.y-h/2;
  var x0=Math.floor(ox/256), x1=Math.floor((ox+w)/256), y0=Math.floor(oy/256), y1=Math.floor((oy+h)/256);
  var html="";
  for(var x=x0;x<=x1;x++) for(var y=y0;y<=y1;y++){
    if(y<0||y>=n) continue; var xx=((x%n)+n)%n;
    var L=Math.round(x*256-ox), T=Math.round(y*256-oy);
    html+='<img src="https://tile.openstreetmap.org/'+mz+'/'+xx+'/'+y+'.png" style="left:'+L+'px;top:'+T+'px" loading="lazy" alt="">';
  }
  box.innerHTML=html;
}
function mapPins(){
  var box=$("#map"); if(!box) return;
  box.querySelectorAll(".pin").forEach(function(p){ p.remove(); });
  var pts = DEV.filter(function(d){ return d.state && d.state.loc; });
  $("#mapNone").style.display = pts.length? "none":"flex";
  if(!pts.length){ $("#mapNone").textContent = DEV.length? "Kisi device ki location nahi mili" : "Koi device juda nahi"; return; }
  var m=$("#map"), w=m.clientWidth, h=m.clientHeight;
  if(!mc) mapFit();
  pts.forEach(function(d){
    var p=proj(d.state.loc.lat,d.state.loc.lng,mz);
    var x=p[0]-mc.x+w/2, y=p[1]-mc.y+h/2;
    if(x<-40||y<-40||x>w+40||y>h+40) return;
    var i=DEV.indexOf(d);
    var el=El("div","pin"+(i===target?" me":""), esc(d.name||d.id));
    el.style.left=x+"px"; el.style.top=y+"px";
    el.onclick=function(){ target=i; render(); };
    box.appendChild(el);
  });
  $("#mapInfo").textContent = pts.length+" location";
}

var catFilter="Sab";
function renderCats(){
  var box=$("#catChips"); box.innerHTML="";
  var b0=El("button","chip"+(catFilter==="Sab"?" on":""), "All ("+CMDS.length+")");
  b0.onclick=function(){ catFilter="Sab"; renderCats(); renderCmds(); }; box.appendChild(b0);
  CATS.forEach(function(c){ var b=El("button","chip"+(catFilter===c[0]?" on":""), c[1]+" "+c[2]+" ("+c[3]+")");
    b.onclick=function(){ catFilter=c[0]; renderCats(); renderCmds(); }; box.appendChild(b); });
}
function renderCmds(){
  var g=$("#cmdGrid"); g.innerHTML="";
  var q=($("#q").value||"").toLowerCase(), shown=0, last="";
  CMDS.forEach(function(c){
    if(catFilter!=="Sab" && c[0]!==catFilter) return;
    if(q && (c[2]+" "+c[3]+" "+c[4]).toLowerCase().indexOf(q)<0) return;
    if(catFilter==="Sab" && c[0]!==last){ last=c[0]; var m=catMeta(c[0]);
      g.appendChild(El("div","cathead","<span>"+m[1]+" "+m[2]+"</span><small>"+m[3]+"</small>")); }
    var row=El("button","crow",
      '<span class="c1"><span class="em">'+c[1]+'</span><span class="code">'+esc(c[2])+'</span>'+
      (catFilter==="Sab"?"":'<span class="badge" style="background:#141b29;color:#9fb0c8">'+catMeta(c[0])[2]+'</span>')+'</span>'+
      '<span class="c2">'+esc(c[3])+'</span>'+(c[4]? '<span class="c3">jaise: '+esc(c[4])+'</span>':''));
    row.onclick=function(){ send(c[2], c[3], row); }; g.appendChild(row); shown++;
  });
  if(!shown) g.appendChild(El("div","crow","<span class='c2'>Kuchh nahi mila</span>"));
  $("#cmdCount").textContent = shown+" command";
}
function catMeta(id){ for(var i=0;i<CATS.length;i++) if(CATS[i][0]===id) return CATS[i]; return ["","","",""]; }

/* ---------------- send ---------------- */
function send(cmd, label, row){
  var d=DEV[target]; if(!d){ toast("Koi device nahi"); return; }
  var txt = String(cmd||"").trim();
  if(txt.charAt(0)!=="/") txt = "/"+txt;
  if(row){ row.classList.add("sending"); setTimeout(function(){ row.classList.remove("sending"); row.classList.add("done");
    setTimeout(function(){ row.classList.remove("done"); },1400); }, 700); }
  toast((stOn(d)?"":"offline — ")+d.name+": "+txt);
  api("/c", { t:TOKEN, text:txt, to:d.id }).then(function(r){
    if(!r || !r.ok){ toast("— " + ((r&&r.err)||"pul se baat nahi hui")); return; }
    lastCid=r.cid; setTimeout(pull, 1200);
  });
}
function toDevice(i, cmd){ var t=target; target=i; send(cmd, cmd, null); target=t; }
function addResult(text){
  var w=$("#devCards"); if(!w) return;
  var box=$("#lastRes");
  if(!box){ box=El("div","card",'<b style="font-size:.86rem">Jawab</b><div id="lastResTx" style="margin-top:7px;color:#d6deeb;font-size:.86rem;white-space:pre-wrap"></div>');
    box.id="lastRes"; var dash=$("#v-dash"); dash.insertBefore(box, dash.children[3]||null); }
  var t=$("#lastResTx"); if(t) t.textContent=String(text).slice(0,1500);
}

/* ---------------- boot ---------------- */
function boot(){
  var fs=localStorage.getItem("gfs"); if(fs) document.documentElement.style.setProperty("--fs",fs);
  $("#setWorker").textContent = WORKER || "—";
  $("#foot").textContent = "Guardian Panel · v5.0";
  $("#setRefresh").textContent = (every/1000)+" second";
  renderCats(); renderCmds(); setEvery(every);
  var th=$("#themes"); if(th){ th.innerHTML=""; [["Dark","#9b7cff"],["Cyan","#38e1ff"],["Green","#5ce6a0"],["Amber","#ffc44d"]].forEach(function(t){
    var b=El("button","chip",'<span style="color:'+t[1]+'">●</span> '+t[0]); b.onclick=function(){ document.documentElement.style.setProperty("--violet",t[1]); toast(t[0]); }; th.appendChild(b); }); }
  fetch("latest.json",{cache:"no-store"}).then(function(r){ return r.json(); }).then(function(j){ LATEST=j.ver||""; render(); }).catch(function(){
    api("/latest",null,"GET").then(function(j){ if(j&&j.ver){ LATEST=j.ver; render(); } }); });
  if(!TOKEN){
    document.body.innerHTML = '<div class="card center"><b>Guardian Panel</b><p style="color:var(--muted);font-size:.85rem">Open from Telegram bot.</p></div>';
    return;
  }
  api("/open?t="+TOKEN,null,"GET").then(function(j){
    if(!j || !j.ok){ $("#mapNone").textContent = (j&&j.err)||"—"; return; }
    pull(); tick();
  });
  window.addEventListener("resize", function(){ drawTiles(); mapPins(); });
}
boot();
